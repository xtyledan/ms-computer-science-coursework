name: Python Coursework Validation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: '0 6 * * 1'
      timezone: "America/Los_Angeles"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-python:
    name: Validate Python and Jupyter Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install notebook validator
        run: python -m pip install nbformat

      - name: Check Python syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile
          import sys

          files = [
              path
              for path in Path(".").rglob("*.py")
              if ".git" not in path.parts
          ]

          if not files:
              print("No Python files found.")
              sys.exit(0)

          failures = []

          for path in files:
              try:
                  py_compile.compile(str(path), doraise=True)
                  print(f"PASS: {path}")
              except py_compile.PyCompileError as error:
                  print(f"FAIL: {path}")
                  print(error)
                  failures.append(path)

          print()
          print(f"Checked {len(files)} Python file(s).")

          if failures:
              print(f"{len(failures)} file(s) failed validation.")
              sys.exit(1)

          print("All Python files passed syntax validation.")
          PY

      - name: Validate Jupyter notebooks
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          import sys

          notebooks = [
              path
              for path in Path(".").rglob("*.ipynb")
              if ".git" not in path.parts
          ]

          if not notebooks:
              print("No Jupyter notebooks found.")
              sys.exit(0)

          failures = []

          for path in notebooks:
              try:
                  notebook = nbformat.read(path, as_version=4)
                  nbformat.validate(notebook)
                  print(f"PASS: {path}")
              except Exception as error:
                  print(f"FAIL: {path}")
                  print(error)
                  failures.append(path)

          print()
          print(f"Checked {len(notebooks)} notebook(s).")

          if failures:
              print(f"{len(failures)} notebook(s) failed validation.")
              sys.exit(1)

          print("All notebooks passed validation.")
          PY
