logging.level.org.atmosphere=warn

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=false

# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/flow/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,com.snhu.mscs.cs600

# Let Hibernate update the schema automatically or create it if it does not exist.
#
# DO NOT DO THIS IN PRODUCTION!
#
# Instead, use Flyway or another controlled way of managing your database schema.
# See https://vaadin.com/docs/latest/building-apps/forms-data/add-flyway for instructions.
spring.jpa.hibernate.ddl-auto=update

# Application name
spring.application.name=module7

## Server connection properties
server.address=127.0.0.1

## Unencrypted Port
#server.port=8080

## Encrypted Port - Using 8443 (untrusted)
server.port=8443

## Cerrtificate Information - keystore must live parallel to pom.xml
server.ssl.key-store = keystore.p12
server.ssl.key-store-password = cs600
server.ssl.key-store-type = PKCS12
server.ssl.key-alias = cs600dev

## Default connection pool for spring JPA defaults
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

## PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/Module7
spring.datasource.username=cs600
spring.datasource.password=cs600

# Author: Tyler Daniels - CS 600 Module Seven API integration
sunrise.api.url=https://api.sunrisesunset.io/json