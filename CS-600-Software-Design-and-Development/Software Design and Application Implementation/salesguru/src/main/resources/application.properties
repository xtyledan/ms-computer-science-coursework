spring.application.name=salesguru

server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8443}

server.ssl.key-store=${SSL_KEYSTORE_PATH:keystore.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=${SSL_KEY_ALIAS:cs600dev}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/SalesGuru}
spring.datasource.username=${DB_USER:cs600}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sql/salesguru_plus.sql

salesguru.auth.url=${AUTH_DB_URL:jdbc:postgresql://localhost:5432/SalesGuruAuth}
salesguru.auth.username=${AUTH_DB_USER:cs600}
salesguru.auth.password=${AUTH_DB_PASSWORD}

spring.thymeleaf.cache=false
server.error.include-message=never