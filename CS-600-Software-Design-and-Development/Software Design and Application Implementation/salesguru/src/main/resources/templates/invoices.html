<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sales Guru+ | Invoices</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>

<header>
    <h1>Sales Guru+</h1>

    <nav>
        <a th:href="@{/companies}">Companies</a>
        <a th:href="@{/items}">Products</a>
        <a th:href="@{/invoices}">Invoices</a>
    </nav>

    <form th:action="@{/logout}" method="post">
        <button type="submit">Logout</button>
    </form>
</header>

<main>
    <div class="page-heading">
        <h2>Sales Invoices</h2>
        <a class="button" th:href="@{/invoices/new}">
            Create Invoice
        </a>
    </div>

    <section class="card">
        <table>
            <thead>
                <tr>
                    <th>Invoice #</th>
                    <th>Company</th>
                    <th>Representative</th>
                    <th>Date</th>
                    <th>Total</th>
                    <th>Details</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="invoice : ${invoices}">
                    <td th:text="${invoice.invoiceNumber}"></td>
                    <td th:text="${invoice.companyName}"></td>
                    <td th:text="${invoice.representativeName}"></td>
                    <td th:text="${invoice.dateOfSale}"></td>
                    <td th:text="${invoice.total}"></td>

                    <td>
                        <a th:href="@{/invoices/{id}(id=${invoice.invoiceNumber})}">
                            View
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </section>
</main>

</body>
</html>
